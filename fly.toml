app = "retail-sales-forecast-tll-6w"
primary_region = "iad"    # change to your nearest region

[build]
  builder = "paketobuildpacks/builder:base"   # or use Dockerfile if you have one

[env]
  PORT = "8080"
  ENVIRONMENT = "production"
  AUTH_ENABLED = "True"
  AUTO_RETRAIN_ENABLED = "True"
  AUTO_RETRAIN_THRESHOLD = "100"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[processes]
  app = "uvicorn api.main:app --host 0.0.0.0 --port 8080"

[mounts]
  source = "retail_data"
  destination = "/app/data"